name: Local legacy redemption regression

on:
  push:
    branches:
      - test/legacy-burn-solvency
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  local-redemption-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run local chain only
        env:
          ALCHEMY_KEY: ""
          MAINNET_PRIVATE_KEY: ""
        run: npx hardhat test test/LegacyBurnSolvency.test.js --network hardhat
